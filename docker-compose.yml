version: "3.9"

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=file:./mindsieve.db
      - PORT=3001
      - CORS_ORIGIN=http://localhost:80
    volumes:
      - mindsieve-data:/app/prisma

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mindsieve-data:
